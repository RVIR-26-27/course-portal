# PUBLIC course-portal: Supabase Free projects pause after 1 week without
# user database activity. A daily call of the public.keepalive() RPC (anon key;
# it reads no data) keeps the project active. Runs on free public-repository
# minutes. GitHub disables scheduled workflows after 60 days without commits in
# the repository; re-enable under Actions → keepalive if that happens.
name: keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Database keep-alive query
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL not configured"; exit 0; }
          curl -fsS --retry 3 --retry-delay 20 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'
